// ---------- combat ----------
function startAtk(f,type){f.atk={type,t:0,dur:type=='s'?.55:type=='k'?.42:.28,hit:false};
 sfx(type=='s'?260:420,.1,'triangle',.06);
 if(f===P&&E.hurt<=0&&!E.atk&&E.blockT<=0&&E.x-P.x<115){const r=Math.random();if(r<.28)E.blockT=.45;else if(r<.48){E.dodge=.32;E.fear=.6;txt.push({x:E.x,y:GY-150,t:0,s:'ESQUIVE',c:'#8fd0ff'})}}}
function pop(x,y,s,c){txt.push({x,y,t:0,s,c:c||'#ffe27a'});fx.push({x,y,t:0})}
function playerHit(type){const dist=E.x-P.x,reach=type=='s'?108:type=='k'?94:80;if(dist>reach)return;
 const dmg=(type=='s'?9:type=='k'?6:4)+Math.min(2,Math.floor(combo/3));
 if(E.blockT>0){E.hp-=dmg*.25;pop(E.x-10,GY-150,'BLOQUÉ','#8fd0ff');sfx(120,.1,'square',.06)}
 else{E.hp-=dmg;E.hurt=.3;E.dodge=0;if(type=='s'||E.hp<35)E.fear=1;E.atk=null;E.x+=type=='s'?24:type=='k'?16:10;combo++;comboT=1.6;shake=type=='s'?9:type=='k'?6:4;
  pop(E.x-10,GY-150,type=='s'?'KATAI !':type=='k'?'KICK !':['POW !','PAF !','WHAM !'][combo%3]);sfx(type=='s'?110:170,.14,'sawtooth',.09)}
 if(E.hp<=0){E.hp=0;state='end';E.atk=null;E.blockT=0;P.win=true;P.atk=null;endT=1.3;
  const s=Math.round(elapsed);$('eh').textContent='MAMIITA GAGNE !';$('ep').textContent='Victoire en '+s+' s'+(P.hp>=100?' — sans une égratignure !':'');sfx(80,.5,'sawtooth',.1)}}
function update(dt){
 P.t+=dt;E.t+=dt;
 if(state=='menu'){return}
 if(state=='intro'){intro+=dt;if(intro>2)state='fight';return}
 if(state=='end'){endT-=dt;if(E.ko<1)E.ko+=dt/.6;if(endT<=0)$('end').style.display='flex';return}
 elapsed+=dt;timeLeft-=dt;if(comboT>0){comboT-=dt;if(comboT<=0)combo=0}
 if(timeLeft<=0){state='end';P.win=true;endT=1;$('eh').textContent='MAMIITA GAGNE !';$('ep').textContent='Temps écoulé : victoire aux points';return}
 // joueuse
 if(P.hurt>0)P.hurt-=dt;
 if(P.atk){const a=P.atk;a.dur=a.type=='s'?.55:a.type=='k'?.42:.28;a.t+=dt;
  if(!a.hit&&a.t/a.dur>=(a.type=='s'?.5:a.type=='k'?.45:.38)){a.hit=true;playerHit(a.type)}
  if(state=='fight'&&a.t>=a.dur+.06){P.atk=null;if(P.buf){startAtk(P,P.buf);P.buf=null}}
  P.moving=false}
 else if(P.hurt<=0){const d=key.r-key.l;P.x+=d*140*dt;P.moving=!!d}else P.moving=false;
 // adversaire
 if(E.fear>0)E.fear-=dt;
 if(E.hurt>0)E.hurt-=dt;
 else if(E.blockT>0){E.blockT-=dt;if(E.blockT<=0)E.cd=Math.min(E.cd,.15)}
 else if(E.dodge>0){E.dodge-=dt;E.x+=260*dt;E.moving=true}
 else if(E.atk){const a=E.atk;a.t+=dt;E.moving=false;
  if(!a.hit&&a.t/a.dur>=.62){a.hit=true;if(E.x-P.x<=88){P.hp=Math.max(12,P.hp-5);P.hurt=.25;P.atk=null;P.buf=null;P.x-=14;shake=5;pop(P.x,GY-150,'AÏE !','#ff9fb2');sfx(140,.12,'square',.08)}}
  if(a.t>=a.dur){E.atk=null;if(Math.random()<.6)E.cd=.08}}
 else{E.cd-=dt;const d=E.x-P.x;
  if(d>66){E.x-=115*dt;E.moving=true}else if(d<52){E.x+=60*dt;E.moving=true}else E.moving=false;
  if(E.cd<=0&&d<=88){E.atk={type:'g',t:0,dur:.42,hit:false};E.cd=.4+Math.random()*.35}}
 if(P.x<28)P.x=28;if(E.x>336)E.x=336;
 if(E.x-P.x<46){if(E.x<335)E.x=P.x+46;else P.x=E.x-46}
}

function bar(x,y,w,v,rev){X.fillStyle='#120a0a';rr(x,y,w,15,3);X.fill();const fw=Math.max(0,(w-4)*v/100);
 const g=X.createLinearGradient(0,y,0,y+15);g.addColorStop(0,'#9cf56a');g.addColorStop(.5,'#25b43f');g.addColorStop(1,'#0f6b25');X.fillStyle=g;X.fillRect(rev?x+w-2-fw:x+2,y+2,fw,11);X.strokeStyle='#d9b44a';X.lineWidth=2;rr(x,y,w,15,3);X.stroke()}
function big(s,y,sz,c){X.font=sz+'px Impact,"Arial Black",sans-serif';X.textAlign='center';X.lineWidth=6;X.strokeStyle='#2a0a3a';X.strokeText(s,W/2,y);X.fillStyle=c||'#ffe27a';X.fillText(s,W/2,y)}
function draw(){
 X.save();if(shake>0){X.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake=Math.max(0,shake-.8)}
 X.drawImage(BG[DM[decor]],0,0,W,H);
 fighter(E,ENP,false);fighter(P,OUT[outfit],true);
 X.textAlign='center';X.font='bold 24px Impact,"Arial Black",sans-serif';
 txt=txt.filter(o=>(o.t+=.016)<.7);txt.forEach(o=>{X.globalAlpha=1-o.t/.7;X.lineWidth=5;X.strokeStyle='#2a0a3a';X.strokeText(o.s,o.x,o.y-o.t*50);X.fillStyle=o.c;X.fillText(o.s,o.x,o.y-o.t*50)});X.globalAlpha=1;
 fx=fx.filter(o=>(o.t+=.016)<.22);fx.forEach(o=>{const r=10+o.t*140;for(let i=0;i<8;i++){const a=i*.785;ln(o.x+Math.cos(a)*r*.4,o.y+Math.sin(a)*r*.4,o.x+Math.cos(a)*r*.7,o.y+Math.sin(a)*r*.7,3,'#fff6b0')}});
 if(state!='menu'){
  bar(10,14,150,P.hp,false);bar(200,14,150,E.hp,true);
  X.font='bold 11px Impact,sans-serif';X.lineWidth=3;X.strokeStyle='#000';X.fillStyle='#f4c542';X.textAlign='left';X.strokeText('MAMIITA',16,26);X.fillText('MAMIITA',16,26);X.textAlign='right';X.strokeText('PAPIITO',344,26);X.fillText('PAPIITO',344,26);
  X.textAlign='center';X.font='bold 24px Impact,sans-serif';X.fillStyle='#fff';X.fillText(Math.max(0,Math.ceil(timeLeft)),W/2,34);
  if(combo>=2&&state=='fight'){X.font='bold 18px Impact,sans-serif';X.fillStyle='#ffe27a';X.fillText('Combo x'+combo,W/2,66)}
  if(state=='intro'){const k=intro<1.1;big(k?'ROUND 1':'FIGHT !!',230,k?54:76,k?'#fff':'#e11d1d')}
 }
 X.restore()}
let last=0;function loop(ts){const dt=Math.min(.033,(ts-last)/1000||0);last=ts;update(dt);draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);

function pick(ids,cb){ids.forEach(id=>[...$(id).children].forEach((c,i)=>c.onclick=()=>{cb(i);ids.forEach(d=>[...$(d).children].forEach((x,j)=>x.classList.toggle('on',j==i)))}))}

function start(){MM=0;lay();reset();state='intro';intro=0;$('menu').style.display='none';$('title').style.display='none';$('end').style.display='none';$('pad').style.display='flex';sfx(500,.2,'triangle',.08)}

$('go').onclick=start;$('again').onclick=start;$('tomenu').onclick=toMenu;
function atk(t){if(state!='fight')return;if(!P.atk&&P.hurt<=0)startAtk(P,t);else if(P.atk)P.buf=t}
function hold(id,dn,up){const e=$(id);e.addEventListener('pointerdown',v=>{v.preventDefault();try{e.setPointerCapture(v.pointerId)}catch(_){}e.classList.add('p');dn()});
 ['pointerup','pointercancel','lostpointercapture'].forEach(n=>e.addEventListener(n,()=>{e.classList.remove('p');up&&up()}))}
hold('bl',()=>key.l=1,()=>key.l=0);hold('br',()=>key.r=1,()=>key.r=0);

addEventListener('keydown',e=>{const k=e.key.toLowerCase();

 else if(k=='z'||k==' '||k=='j')atk('g');else if(k=='x'||k=='k')atk('s');else if(k=='c'||k=='l')atk('k');else return;e.preventDefault()});
addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(k=='arrowleft'||k=='q')key.l=0;if(k=='arrowright'||k=='d')key.r=0});
let lt=0;document.addEventListener('touchend',e=>{const n=Date.now();if(n-lt<350&&!e.target.closest('#menu,#end'))e.preventDefault();lt=n},{passive:false});
['gesturestart','gesturechange','gestureend'].forEach(n=>document.addEventListener(n,e=>e.preventDefault()));
